  <!-- Meta -->
  <text x="48" y="200" font-family="JetBrains Mono, monospace" font-weight="500" font-size="20" fill="#8A887E" letter-spacing="2">SCHRITT 03 · MIT KONZEPT-54</text>
  <!-- Headline -->
  <text x="48" y="270" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#0A0A0A">Monitoring</text>
  <text x="48" y="324" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#0A0A0A">&amp; Betriebsführung</text>
  <!-- Body -->
  <text x="48" y="402" font-family="Inter, sans-serif" font-size="22" fill="#3A3A37">Anlage online: Leistungszahlen, Vorläufe,</text>
  <text x="48" y="432" font-family="Inter, sans-serif" font-size="22" fill="#3A3A37">Arbeitszahl — transparent im Blick. Unser</text>
  <text x="48" y="462" font-family="Inter, sans-serif" font-size="22" fill="#3A3A37">Partner konzept-54 optimiert den Betrieb</text>
  <text x="48" y="492" font-family="Inter, sans-serif" font-size="22" fill="#3A3A37">laufend. Ergebnis: stabile Arbeitszahlen,</text>
  <text x="48" y="522" font-family="Inter, sans-serif" font-size="22" fill="#3A3A37">weniger Heizkosten.</text>
