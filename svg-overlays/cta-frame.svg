<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- BG -->
  <rect width="1080" height="1920" fill="#0A0A0A"/>
  <!-- Grid -->
  <g stroke="#161614" stroke-width="1">
    <path d="M0,240 H1080 M0,480 H1080 M0,720 H1080 M0,960 H1080 M0,1200 H1080 M0,1440 H1080 M0,1680 H1080"/>
    <path d="M240,0 V1920 M480,0 V1920 M720,0 V1920 M960,0 V1920"/>
  </g>
  <!-- Logo placeholder -->
  <g transform="translate(80,120)">
    <text font-family="Inter, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-1">FriStD-Bau</text>
    <text y="34" font-family="JetBrains Mono, monospace" font-size="14" fill="#8A887E" letter-spacing="3">ZIMMEREI &amp; BAUFIRMA</text>
  </g>
  <!-- Headline -->
  <text x="540" y="820" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="-3">Kostenlose</text>
  <text x="540" y="950" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" letter-spacing="-3">Erstberatung.</text>

  <!-- Primary button -->
  <g transform="translate(240,1080)">
    <rect width="600" height="140" rx="70" fill="#FFE500"/>
    <text x="300" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="48" fill="#0A0A0A">Erstberatung →</text>
  </g>
  <!-- Secondary button -->
  <g transform="translate(240,1260)">
    <rect width="600" height="140" rx="70" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="300" y="90" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="40" fill="#FFFFFF">Förderscheck öffnen</text>
  </g>

  <!-- Phone ribbon -->
  <g transform="translate(0,1720)">
    <rect width="1080" height="120" fill="#FFE500"/>
    <text x="540" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="54" fill="#0A0A0A">📞 040 · 386 745 65</text>
  </g>
  <!-- URL -->
  <text x="540" y="1560" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="36" fill="#8A887E" letter-spacing="2">waermepumpe.fristd-bau.com</text>
</svg>
